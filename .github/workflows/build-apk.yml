name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Validate & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Node Dependencies
        run: npm install

      - name: Validate JavaScript Syntax
        run: node check_js_syntax.js

      - name: Run Clinical Engine Simulations
        run: node run_full_simulation.js

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Configure Android SDK Location & Permissions
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p android/capacitor-cordova-android-plugins
          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "// Fallback variables" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          fi
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Run Android Unit Tests
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android Release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Capture Gradle Build Output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Prepare Signed Release APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_NAME="Osrawy_Clinical_Navigator_v${VERSION}.apk"
          echo "Target Release APK: $APK_NAME"

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp -f "android/app/build/outputs/apk/release/app-release.apk" "$APK_NAME"
          else
            BUILT_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp -f "$BUILT_APK" "$APK_NAME"
          fi

          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          echo "Verifying permanent APK signature:"
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$APK_NAME"

          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Osrawy_Clinical_Navigator_APK
          path: Osrawy_Clinical_Navigator_v*.apk

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Osrawy_Clinical_Navigator_v*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
